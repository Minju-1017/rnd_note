<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>네오코스텍 연구소 시스템</title>

    <style>
        .layout {
            display: flex;
        }

        nav {
            width: 200px;
        }

        main {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tfoot {
            border-top: 1px solid #ddd;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .info p {
            margin: 10px;
        }

        .button-area {
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="layout">
        <nav>
			<!-- 로그인 사용자 정보 -->
			<div class="user-info">
				<strong>홍연구</strong>
				<p>담당 거래처 : A사</p>
			</div>
            <ul>
                <li><a href="./note.html">연구노트</a></li>
                <li><a href="#">로그아웃</a></li>
            </ul>
        </nav>
        <main>
            <h1>처방표</h1>

            <!-- 연구 정보 -->
            <div class="info">
                <p><strong>차수:</strong> 2차</p>
                <p><strong>점도:</strong> 끈적</p>
                <p><strong>PH:</strong> 3</p>
                <p><strong>향:</strong> 좋음</p>
                <p><strong>수정방안:</strong> 점도 개선 필요</p>
                <p><strong>날짜:</strong> 2024-10-22</p>
                <p><strong>상태:</strong> 실패</p>
            </div>

            <!-- 처방표 -->
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>원료코드</th>
                        <th>원료명</th>
                        <th>성분명</th>
                        <th>용량(%)</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>RAW001</td>
                        <td>정제수</td>
                        <td>물</td>
                        <td>50.1250</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>RAW002</td>
                        <td>B</td>
                        <td>B</td>
                        <td>25.0000</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>RAW003</td>
                        <td>C</td>
                        <td>C</td>
                        <td>24.8750</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th>합계</th>
                        <th colspan="3"></th>
                        <th>100.0000</th>
                    </tr>
                </tfoot>
            </table>     
            <div class="button-area">
                <button type="button"><a href="./note_detail.html">연구노트 상세</a></button>
            </div>         
        </main>
    </div>

</body>
</html>
