<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>네오코스텍 연구소 시스템</title>

    <style>
        .layout {
            display: flex;
        }

        nav {
            width: 200px;
        }

        main {
            flex: 1;
        }

		table {
			width: 100%;
			border-collapse: collapse;
			border-top: 1px solid #ddd;
			border-bottom: 1px solid #ddd;
		}

		.table-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}

		.table-header p {
			margin: 0;
		}

		th {
			background-color: #f5f5f5;
			border-bottom: 1px solid #ddd;
			padding: 10px;
			text-align: center;
			white-space: nowrap;
		}

		td {
			padding: 10px;
			text-align: center;
			white-space: nowrap;
		}

		.info {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			border-bottom: 1px solid #ddd;
			padding-bottom: 10px;
			margin-bottom: 15px;
		}

		.info p {
			margin: 10px;
		}

		.info strong {
			display: inline-block;
			width: 70px;
		}

		.search {
			margin-top: 50px;
			margin-bottom: 50px;
		}

		.page-area {
			display: flex;
			justify-content: space-between;
			margin-top: 20px;
		}

		h2 {
			margin-top: 50px;
			margin-bottom: 20px;
		}

		.user-info p {
            margin: 3px 0;
        }
    </style>
</head>

<body>

    <div class="layout">
        <nav>
			<!-- 로그인 사용자 정보 -->
			<div class="user-info">
				<strong>홍연구</strong>
				<p>연구원 (2등급)</p>
                <p>담당 거래처: A사</p>
			</div>
            <ul>
                <li><a href="./note.html">연구노트</a></li>
				<li><a href="./ingredient_search.html">원료검색</a></li>
				<li><a href="./legacy_data.html">자료관리</a></li>
				<li><a href="./permission.html">권한안내</a></li>
                <li><a href="#">로그아웃</a></li>
            </ul>
        </nav>
        <main>
            <h1>연구노트 상세</h1>

			<!-- 정보 -->
			<div class="info">
				<p><strong>관리번호:</strong> <span id="managementNumber"></span></p>
				<p>
					<strong>제품명:</strong>
					<input type="text" id="productName">
				</p>
				<p><strong>거래처:</strong> <span id="company"></span></p>
				<p>
					<strong>담당:</strong>
					<input type="text" id="manager">
				</p>
				<p>
					<strong>부담당:</strong>
					<input type="text" id="subManager">
				</p>
				<p><strong>현재차수:</strong> <span id="currentRound"></span></p>
				<p><strong>상태:</strong> <span id="status"></span></p>
				<p><strong>시작일:</strong> <span id="startDate"></span></p>
				<p><strong>종료일:</strong> -</p>
			</div>
			<div>
				<button type="button">기본 정보 수정</button>
			</div>

			<!-- 연구 차수 -->
			<h2>차수별 연구 기록</h2>

			<!-- 검색 영역 -->
			<div class="search">
				<form>
					<label>기간</label>
					<input type="text" placeholder="시작일">
					<input type="text" placeholder="종료일">

					<select>
						<option selected>상태</option>
						<option>성공</option>
						<option>실패</option>
					</select>

					<select>
						<option selected>점도</option>
						<option>묽음</option>
						<option>보통</option>
						<option>끈적</option>
					</select>

					<select>
						<option selected>PH</option>
						<option>0</option>
						<option>1</option>
						<option>2</option>
						<option>3</option>
						<option>4</option>
						<option>5</option>
						<option>6</option>
						<option>7</option>
						<option>8</option>
						<option>9</option>
						<option>10</option>
						<option>11</option>
						<option>12</option>
						<option>13</option>
						<option>14</option>
					</select>

					<select>
						<option selected>향</option>
						<option>나쁨</option>
						<option>좋음</option>
					</select>

					<select>
						<option selected>원료</option>
						<option>원료코드</option>
						<option>원료명</option>
						<option>성분명</option>
					</select>

					<input type="text" placeholder="검색어">
					<button type="submit">검색</button>
					<button type="reset">초기화</button>
				</form>
			</div>

			<!-- 테이블 영역 -->
			<div>
				<div class="table-header">
					<p>Total: 0</p>
					<button type="button">차수 생성</button>
				</div>

				<table>
					<thead>
						<tr>
							<th><input type="checkbox"></th>
							<th>#</th>
							<th>차수</th>
							<th>점도</th>
							<th>PH</th>
							<th>향</th>
							<th>수정방안</th>
							<th>날짜</th>
							<th>상태</th>
						</tr>
					</thead>

					<tbody>
						<tr>
							<td colspan="8">연구 기록이 없습니다.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="page-area">
				<!-- 페이징 -->
				<div>
					<a href="#">이전</a>
					<a href="#">1</a>
					<a href="#">2</a>
					<a href="#">3</a>
					<a href="#">다음</a>
				</div>

				<!-- 버튼 -->
				<div>
					<button type="button">비교하기</button>
					<button type="button">비교 초기화</button>
					<button type="button"><a href="./note.html">연구노트 메인</a></button>
				</div>
			</div>
        </main>
    </div>

	<script>
		const params = new URLSearchParams(location.search);
		document.getElementById("managementNumber").textContent = params.get("managementNumber");
		document.getElementById("productName").value = params.get("productName");
		document.getElementById("company").textContent = params.get("company");
		document.getElementById("manager").value = params.get("manager");
		document.getElementById("subManager").value = params.get("subManager");
		document.getElementById("currentRound").textContent = params.get("currentRound");
		document.getElementById("status").textContent = params.get("status");
		document.getElementById("startDate").textContent = params.get("startDate");
	</script>
</body>
</html>
