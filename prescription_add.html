<!DOCTYPE html>
<html lang="ko">
<head> 
    <meta charset="UTF-8"> 
    <title>네오코스텍 연구소 시스템</title>

    <style>
        .layout {
            display: flex;
        }

        nav {
            width: 200px;
        }

        main {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        input {
            padding: 5px;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .info p {
            margin: 10px;
        }

        .add-button {
            text-align: center;
            margin: 15px 0;
        }

        .button-area {
            margin-top: 20px;
            text-align: right;
        }

        .button-area button {
            margin: 0;
        }

        .attachment {
            margin: 20px 10px;
            display: flex;
            align-items: center;
        }

        .attachment p {
            margin: 0;
            width: 70px;
        }

        tfoot {
            border-top: 1px solid #ddd;
        }

        .user-info p {
            margin: 3px 0;
        }
    </style>
</head>

<body>
    <div class="layout">
        <nav>
			<!-- 로그인 사용자 정보 -->
			<div class="user-info">
				<strong>홍연구</strong>
                <p>연구원 (2등급)</p>
                <p>담당 거래처: A사</p>
			</div>
            <ul>
                <li><a href="./note.html">연구노트</a></li>
                <li><a href="./ingredient_search.html">원료검색</a></li>
                <li><a href="./legacy_data.html">자료관리</a></li>
                <li><a href="./permission.html">권한안내</a></li>
                <li><a href="#">로그아웃</a></li>
            </ul>
        </nav>
        <main>
            <h1>처방표 작성</h1>

            <!-- 연구 정보 -->
            <div class="info">
                <p>
                    <strong>차수:</strong>
                    <span id="round"></span>차
                </p>
                <p>
                    <strong>점도:</strong>
                    <select id="viscosity">
                        <option value="">선택</option>
                        <option value="묽음">묽음</option>
                        <option value="보통">보통</option>
                        <option value="끈적">끈적</option>
                    </select>
                </p>
                <p>
                    <strong>PH:</strong>
                    <select id="ph">
                        <option value="">선택</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                    </select>
                </p>
                <p>
                    <strong>향:</strong>
                    <select id="scent">
                        <option value="">선택</option>
                        <option value="나쁨">나쁨</option>
                        <option value="좋음">좋음</option>
                    </select>
                </p>
                <p>
                    <strong>수정방안:</strong>
                    <input type="text" id="revision">
                </p>
                <p>
                    <strong>날짜:</strong>
                    <span id="date"></span>
                </p>
            </div>

            <!-- 첨부파일 -->
            <div class="attachment">
                <p><strong>첨부파일:</strong></p>
                <input type="file" multiple accept="image/*,.pdf">
            </div>

            <!-- 처방표 -->
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>원료코드</th>
                        <th>원료명</th>
                        <th>성분명</th>
                        <th>용량(%)</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="ingredient-list">
                    <tr>
                        <td colspan="6">입력된 처방이 없습니다.</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <th colspan="5">합계</th>
                        <th id="total">0.0000</th>
                    </tr>
                </tfoot>
            </table>

            <!-- 원료 추가 -->
            <div class="add-button">
                <button type="button" onclick="addIngredient()">+</button>
                <button type="button" onclick="copyPreviousPrescription()">이전 차수 복사</button>
            </div>

            <!-- 버튼 -->
            <div class="button-area">
                <button type="button" onclick="calculationPrescription()">계산</button>
                <button type="button" onclick="resetPrescription()">초기화</button>
                <button type="button" onclick="savePrescription()">저장</button>
                <button type="button"><a href="./note_detail.html">취소</a></button>
            </div>
        </main>
    </div>

    <script>
        // 차수 계산
        const params = new URLSearchParams(location.search);
        const nextRound = params.get("round");

        document.getElementById("round").textContent = nextRound;

        // 오늘 날짜 자동 입력
        const today = new Date();

        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        document.getElementById("date").textContent =  year + "-" + month + "-" + day;

        // 원료 추가
        function addIngredient() {
            const tbody = document.getElementById("ingredient-list");

            // "입력된 처방이 없습니다." 문구 제거
            if (tbody.rows.length === 1 &&
                tbody.rows[0].cells.length === 1 &&
                tbody.rows[0].cells[0].colSpan === 6) {
                tbody.innerHTML = "";
            }

            const rowNumber = tbody.rows.length + 1;
            const row = tbody.insertRow();

            row.innerHTML = `
                <td>${rowNumber}</td>

                <td>
                    <select onchange="changeIngredient(this)">
                        <option value="">선택</option>
                        <option value="RAW002">RAW002</option>
                        <option value="RAW003">RAW003</option>
                        <option value="RAW004">RAW004</option>
                        <option value="RAW005">RAW005</option>
                        <option value="RAW006">RAW006</option>
                        <option value="RAW007">RAW007</option>
                        <option value="RAW008">RAW008</option>
                        <option value="RAW009">RAW009</option>
                        <option value="RAW010">RAW010</option>
                    </select>
                </td>

                <td>
                    <span class="ingredient-name"></span>
                </td>

                <td>
                    <span class="ingredient-component"></span>
                </td>

                <td>
                    <input type="number" step="0.0001" min="0.0001" class="amount">
                </td>
                
                <td>
                    <button type="button" onclick="deleteIngredient(this)">X</button>
                </td>
            `;
        }

        function changeIngredient(select) {
            const selectedValue = select.value;

            // 다른 행에서 이미 선택한 원료인지 확인
            if (selectedValue !== "") {
                const selects = document.querySelectorAll("#ingredient-list select");

                for (let i = 0; i < selects.length; i++) {
                    if (selects[i] !== select && selects[i].value === selectedValue) {
                        alert("이미 선택한 원료입니다.");
                        select.value = "";
                        return;
                    }
                }
            }

            const row = select.closest("tr");
            const name = row.querySelector(".ingredient-name");
            const component = row.querySelector(".ingredient-component");

            const ingredientInfo = {
                RAW002: "B",
                RAW003: "C",
                RAW004: "D",
                RAW005: "E",
                RAW006: "F",
                RAW007: "G",
                RAW008: "H",
                RAW009: "I",
                RAW010: "J"
            };

            const value = select.value;
            if (value === "") {
                name.textContent = "";
                component.textContent = "";
                return;
            }

            name.textContent = ingredientInfo[value];
            component.textContent = ingredientInfo[value];
        }

        function confirm() {
            const amountInputs =
                document.querySelectorAll(".amount");

            if (amountInputs.length === 0) {
                alert("원료를 1개 이상 입력해 주세요.");
                return null;
            }

            // 원료코드 선택 여부 확인
            const ingredientSelects =
                document.querySelectorAll("#ingredient-list select");

            for (let i = 0; i < ingredientSelects.length; i++) {
                if (ingredientSelects[i].value === "") {
                    alert("원료코드를 선택해 주세요.");
                    return null;
                }
            }

            const selectedCodes = [];

            for (let i = 0; i < ingredientSelects.length; i++) {
                const code = ingredientSelects[i].value;

                if (selectedCodes.includes(code)) {
                    alert("중복된 원료가 있습니다.");
                    return null;
                }

                selectedCodes.push(code);
            }

            let total = 0;

            for (let i = 0; i < amountInputs.length; i++) {
                if (amountInputs[i].value === "") {
                    alert("용량을 입력해 주세요.");
                    return null;
                }

                if (parseFloat(amountInputs[i].value) <= 0) {
                    alert("용량은 0보다 커야 합니다.");
                    return null;
                }

                total += Number(amountInputs[i].value);
            }

            if (total > 100) {
                alert("용량의 합계가 100을 초과할 수 없습니다.");
                return null;
            }

            return total;
        }

        // 계산
        function calculationPrescription() {
            const tbody = document.getElementById("ingredient-list");
            const total = confirm();

            if (total === null) {
                return;
            }

            const remaining = 100 - total;
            const waterRow = document.getElementById("water-row");

            if (waterRow) {
                // 정제수 용량만 수정
                waterRow.cells[4].textContent =
                    remaining.toFixed(4);

            } else {
                // 정제수가 없는 경우 새로 추가
                const row = tbody.insertRow();
                row.id = "water-row";

                row.innerHTML = `
                    <td>${tbody.rows.length}</td>
                    <td>RAW001</td>
                    <td>정제수</td>
                    <td>물</td>
                    <td>${remaining.toFixed(4)}</td>
                    <td>
                        <button type="button" onclick="deleteIngredient(this)">X</button>
                    </td>
                `;
            }

            // 정제수를 맨 위로 이동
            const water = document.getElementById("water-row");

            if (water) {
                tbody.insertBefore(water, tbody.firstChild);
            }

            // 순번 다시 정리
            const rows = tbody.querySelectorAll("tr");

            rows.forEach(function(row, index) {
                row.cells[0].textContent = index + 1;
            });

            document.getElementById("total").textContent = "100.0000";
        }

        // 저장
        function savePrescription() {
            const viscosity = document.getElementById("viscosity").value;
            const ph = document.getElementById("ph").value;
            const scent = document.getElementById("scent").value;
            const revision = document.getElementById("revision").value;

            if (viscosity === "") {
                alert("점도를 선택해 주세요.");
                return;
            }

            if (ph === "") {
                alert("PH를 선택해 주세요.");
                return;
            }

            if (scent === "") {
                alert("향을 선택해 주세요.");
                return;
            }

            if (revision === "") {
                alert("수정방안을 입력해 주세요.");
                return;
            }

            const total = confirm();
            if (total === null) {
                return;
            }

            const waterRow = document.getElementById("water-row");

            if (!waterRow) {
                alert("계산버튼을 눌러 용량이 총 100인지 확인해 주세요.");
                return;
            }

            const waterAmount = Number(waterRow.cells[4].textContent);
            const finalTotal = total + waterAmount;

            if (finalTotal !== 100) {
                alert("계산버튼을 눌러 용량이 총 100인지 확인해 주세요.");
                return;
            }

            location.href = "./note_detail.html";
        }

        function resetPrescription() {
            const tbody = document.getElementById("ingredient-list");
            tbody.innerHTML = `
                <tr>
                    <td colspan="6">입력된 처방이 없습니다.</td>
                </tr>
            `;
            document.getElementById("total").textContent = "0.0000";
        }

        function copyPreviousPrescription() {
            const params = new URLSearchParams(location.search);
            const round = Number(params.get("round"));

            if (round === 1) {
                alert("이전 차수가 없습니다.");
                return;
            }

            const previousRound = round - 1;

            fetch("./prescription_2024_2_" + previousRound + ".html")
                .then(function(response) {
                    return response.text();
                })
                .then(function(html) {

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");

                    const oldRows = doc.querySelectorAll("tbody tr");
                    const tbody = document.getElementById("ingredient-list");

                    // 현재 입력된 내용 삭제
                    tbody.innerHTML = "";

                    oldRows.forEach(function(oldRow) {

                        const cells = oldRow.cells;
                        const codeCell = cells[1];
                        const amountCell = cells[4];
                        const codeSelect = codeCell.querySelector("select");
                        const amountInput = amountCell.querySelector("input");

                        const code = codeSelect
                            ? codeSelect.value
                            : codeCell.textContent.trim();

                        const name = cells[2].textContent.trim();
                        const component = cells[3].textContent.trim();

                        const amount = amountInput
                            ? amountInput.value
                            : amountCell.textContent.trim();

                        // 정제수
                        if (code === "RAW001") {
                            const row = tbody.insertRow();
                            row.id = "water-row";

                            row.innerHTML = `
                                <td>${tbody.rows.length}</td>
                                <td>RAW001</td>
                                <td>${name}</td>
                                <td>${component}</td>
                                <td>${amount}</td>
                                <td>
                                    <button type="button" onclick="deleteIngredient(this)">X</button>
                                </td>
                            `;

                            return;
                        }

                        // 일반 원료
                        const row = tbody.insertRow();

                        row.innerHTML = `
                            <td>${tbody.rows.length}</td>

                            <td>
                                <select onchange="changeIngredient(this)">
                                    <option value="">선택</option>
                                    <option value="RAW002">RAW002</option>
                                    <option value="RAW003">RAW003</option>
                                    <option value="RAW004">RAW004</option>
                                    <option value="RAW005">RAW005</option>
                                    <option value="RAW006">RAW006</option>
                                    <option value="RAW007">RAW007</option>
                                    <option value="RAW008">RAW008</option>
                                    <option value="RAW009">RAW009</option>
                                    <option value="RAW010">RAW010</option>
                                </select>
                            </td>

                            <td>
                                <span class="ingredient-name"></span>
                            </td>

                            <td>
                                <span class="ingredient-component"></span>
                            </td>

                            <td>
                                <input type="number" step="0.0001" min="0.0001" class="amount" value="${amount}">
                            </td>

                            <td>
                                <button type="button" onclick="deleteIngredient(this)">X</button>
                            </td>
                        `;

                        // 원료코드 선택
                        const select = row.querySelector("select");
                        select.value = code;

                        // 원료명 / 성분명 표시
                        changeIngredient(select);
                    });

                    // 합계 표시
                    document.getElementById("total").textContent = "100.0000";
                })
                .catch(function(error) {
                    alert("이전 차수 처방표를 가져오지 못했습니다.");
                    console.log(error);
                });
        }

        function deleteIngredient(button) {
            const tbody = document.getElementById("ingredient-list");
            const row = button.closest("tr");
            row.remove();

            // 순번 다시 정리
            const rows = document.querySelectorAll("#ingredient-list tr");

            rows.forEach(function(row, index) {
                row.cells[0].textContent = index + 1;
            });

            // 현재 처방 용량 합계 계산
            let total = 0;

            const amountInputs = document.querySelectorAll("#ingredient-list .amount");

            amountInputs.forEach(function(input) {
                total += Number(input.value) || 0;
            });

            // 정제수처럼 input이 아닌 용량도 포함
            const waterRow = document.getElementById("water-row");

            if (waterRow) {
                total += Number(waterRow.cells[4].textContent) || 0;
            }

            if (document.querySelectorAll("#ingredient-list tr").length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">입력된 처방이 없습니다.</td>
                    </tr>
                `;

                document.getElementById("total").textContent = "0.0000";
            } else {
                document.getElementById("total").textContent =
                    total.toFixed(4);
            }
        }
    </script>
</body>
</html>
